name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging VPS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )

    steps:
      - name: Verify deploy secrets
        id: secrets
        run: |
          missing=0
          if [ -z "${DEPLOY_SSH_HOST}" ]; then echo "Missing secret: DEPLOY_SSH_HOST"; missing=1; fi
          if [ -z "${DEPLOY_SSH_USER}" ]; then echo "Missing secret: DEPLOY_SSH_USER"; missing=1; fi
          if [ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]; then echo "Missing secret: DEPLOY_SSH_PRIVATE_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure repository secrets for staging SSH deploy."
            exit 1
          fi
          PATH_VALUE="${DEPLOY_PATH:-/opt/p2p-exchanger}"
          echo "path=${PATH_VALUE}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ steps.secrets.outputs.path }}
          DEPLOY_BRANCH: develop
          COMPOSE_FILE: docker-compose.yml:docker-compose.staging.yml
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            bash scripts/deploy-staging-remote.sh
          envs: DEPLOY_PATH,DEPLOY_BRANCH,COMPOSE_FILE
